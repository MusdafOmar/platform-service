services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.6
    container_name: platform-service-cockroach

    command:
      - start-single-node
      - --insecure
      - --store=/cockroach/cockroach-data

    ports:
      - "26257:26257"
      - "8081:8080"

    volumes:
      - cockroach_data:/cockroach/cockroach-data

    healthcheck:
      test:
        - CMD-SHELL
        - cockroach sql --insecure --host=localhost:26257 --execute="SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cockroach_data: